<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>Student Details</title>
  </head>
  <body>
    <div class="Info">
    <h1>Student Information Form</h1>
    <p><strong>(All fields are required)</strong></p>
    </div>
    <form>
    <div class="personal Info">
      <fieldset>
        <legend >Personal Information</legend>
        <label for="name">Full Name:</label>
        <br>
        <input type="text" id="name" placeholder="Enter your full name">
        <span>(Maximum 30 charcters only)</span>
        <br><br>
        <label for="reg">Register Number:</label>
        <br>
        <input type="text" id="reg" placeholder="URK24CS9035">
        <span>(use pattern for matching the regno URK24CS9035 format)</span>
        <br><br>
        <label for="email">Email:</label>
        <br>
        <input type="email" id="email" placeholder="madhan@gmail.com">
        <br><br>
        <label for="pass">Password:</label>
        <br>
        <input type="password" id="pass" placeholder="********">
        <br><br>
        <label for="dob">Date of Birth:</label>
        <br>
        <input type="date" id="dob">
        <br><br>
        <label for="age">Age:</label>
        <br>
        <input type="number" id="age">
        <span>(minimum 17 & maximum 21)</span>
        <br><br>
        <label for="time">Preferred Time:</label>
        <br>
        <input type="time" id="time">
      </fieldset>
    </div>
    <br>
    <div class="academic info">
        <fieldset>
          <legend>Academic Information</legend>
          <label for="depart">Department:</label>
          <br>
          <select id="depart">
            <option value="">--Select Department--</option>
            <option>CSE</option>
            <option>ECE</option>
            <option>EEE</option>
          </select>
          <br><br>
          <label for="gen">Gender:</label>
          <br>
          <input type="radio" name="gen" id="gen" value="Male">Male
          <input type="radio" id="gen" name="gen" value="Female">Female
          <input type="radio" id="gen" name="gen" value="Other">Other
          <br><br>
          <label for="skills">Skills:</label>
          <br>
          <input type="checkbox" id="Skills" name="skills">HTML
          <input type="checkbox" id="skills" name="skills">CSS
          <input type="checkbox" id="skills" name="skills">JavaScript
          <input type="checkbox" id="skills" name="skills">Python
          </HTML>
        </fieldset>
    </div>
    <br>
    <div class="Additional Info">
        <fieldset>
          <legend>Additional Information</legend>
          <label for="resume">Upload Resume</label>
          <br>
          <input type="file" id="resume">
          <br><br>
          <label for="web">Portfolio Website:</label>
          <br>
          <input type="url" id="web">
          <br><br>
          <label for="color">Favorite Color:</label>
          <br>
          <input type="color" id="color">
          <br><br>
        </fieldset>
    </div>
    <br>
    <input type="submit">
    <input type="reset">
  </form>
  </body>
</html>
